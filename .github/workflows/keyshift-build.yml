name: Build KeyShift
on:
  push:
    branches: [master, keyshift-monochrome-ux]
    paths:
      - 'keyshift/source/**'
      - '.github/workflows/keyshift-build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: keyshift/source/package-lock.json
      - name: Install dependencies and build
        working-directory: keyshift/source
        run: |
          npm ci
          npm run build
      - name: Commit generated HTML if changed
        run: |
          if ! git diff --quiet -- keyshift/index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add keyshift/index.html
            git commit -m "build(keyshift): regenerate production page"
            git push
          fi
